name: Website screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/screenshots/sites.txt"
      - ".github/screenshots/shoot.py"
      - ".github/workflows/screenshots.yml"
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python .github/screenshots/shoot.py
      - name: Commit screenshots
        run: |
          git config user.name "aesly-bot"
          git config user.email "noreply@aesly.nl"
          git add --sparse screenshots
          git commit -m "Website screenshots voor showreel" || echo "niets te committen"
          git push
